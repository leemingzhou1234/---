<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>运动刑场 · 花式嘲讽打卡器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f172a;
            padding: 16px;
            color: #f1f5f9;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1, h2 {
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button, input, textarea, select {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 12px 16px;
            border-radius: 60px;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 12px;
            font-family: inherit;
        }
        button {
            background: #3b82f6;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        button:active {
            transform: scale(0.97);
        }
        .btn-small {
            width: auto;
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .member-row {
            background: #0f172a;
            border-radius: 60px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .check-btn {
            background: #334155;
            margin: 0;
            width: auto;
        }
        .checked-btn {
            background: #22c55e;
        }
        .time-badge {
            font-family: monospace;
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .roast-text {
            background: #2d1b2e;
            border-left: 5px solid #ec489a;
            padding: 12px;
            border-radius: 20px;
            margin: 12px 0;
            font-size: 0.9rem;
        }
        .proof-img {
            max-width: 50px;
            max-height: 50px;
            border-radius: 12px;
            margin-left: 8px;
            object-fit: cover;
        }
        hr {
            border-color: #334155;
            margin: 16px 0;
        }
        .warning {
            color: #facc15;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card" style="text-align:center">
        <h1 style="justify-content:center;">🏃‍♂️💨 运动刑场</h1>
        <p>规则：未打卡？社死+嘲讽+公开处刑 🤡</p>
    </div>

    <!-- 创建/设置面板 -->
    <div class="card" id="setupPanel">
        <h2>⚙️ 开刑条件</h2>
        <input type="text" id="roomName" placeholder="局名：羽毛球/跑步/减肥" value="羽毛球复仇局">
        <div class="flex">
            <input type="number" id="penaltyPoints" placeholder="惩罚积分/押金(分)" value="20" step="5">
            <span style="font-size:0.8rem;">💀 未打卡扣分</span>
        </div>
        <div class="flex">
            <input type="text" id="memberNameInput" placeholder="新队友昵称">
            <button id="addMemberBtn" class="btn-small">➕ 添加</button>
        </div>
        <div id="tempMemberList"></div>
        <button id="createRoomBtn">🎉 成立刑房 & 开始打卡</button>
        <div class="warning">💡 点击打卡+传图，可从相册选择运动照片证明！</div>
    </div>

    <!-- 打卡主面板 -->
    <div id="mainPanel" style="display:none;">
        <div class="card">
            <div class="flex" style="justify-content: space-between;">
                <h2 id="roomTitle"></h2>
                <button id="resetBtn" class="btn-small" style="background:#475569;">🔄 新赛季</button>
            </div>
            <div id="penaltyDisplay" class="warning" style="background:#2d2a1e; padding:6px 12px; border-radius:40px;"></div>
            <div id="membersList"></div>
            <hr>
            <div class="flex">
                <button id="genReportBtn" style="background:#ec489a;">🤡 生成嘲讽报告 (复制去群里)</button>
            </div>
            <div id="reportPreview" class="roast-text" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
    // ---------- 全局数据 ----------
    let currentRoom = null;
    let pendingMembers = [];

    // 辅助函数
    function saveRoom() {
        if(currentRoom && currentRoom.id) {
            localStorage.setItem(`room_${currentRoom.id}`, JSON.stringify(currentRoom));
        }
    }

    function loadRoom(id) {
        let raw = localStorage.getItem(`room_${id}`);
        if(raw) {
            try { return JSON.parse(raw); } catch(e) { return null; }
        }
        return null;
    }

    function generateId() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function getCurrentTimeStr() {
        let d = new Date();
        return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }

    function getHoursSinceCheckin(checkinTimeStr) {
        if(!checkinTimeStr) return null;
        let now = new Date();
        let [hours, minutes] = checkinTimeStr.split(':').map(Number);
        let checkinDate = new Date();
        checkinDate.setHours(hours, minutes, 0, 0);
        let diffMs = now - checkinDate;
        let diffHours = Math.floor(diffMs / (1000 * 60 * 60));
        if(diffHours < 0) diffHours = 0;
        return diffHours;
    }

    // 渲染成员+打卡+拍照证明（相册上传版）
    function renderMain() {
        if(!currentRoom) return;
        document.getElementById('roomTitle').innerHTML = `🏟️ ${escapeHtml(currentRoom.name)}`;
        document.getElementById('penaltyDisplay').innerHTML = `⚡ 当前未打卡惩罚：扣除 ${currentRoom.penaltyPoints} 信誉分 + 群内嘲讽`;

        let members = Object.values(currentRoom.members);
        let container = document.getElementById('membersList');
        let todayStr = new Date().toISOString().slice(0,10);
        
        container.innerHTML = members.map(member => {
            let checkRecord = member.checkIns[todayStr];
            let isChecked = checkRecord && checkRecord.done === true;
            let checkTime = checkRecord ? checkRecord.time : null;
            let hoursAgo = (isChecked && checkTime) ? getHoursSinceCheckin(checkTime) : null;
            let proofUrl = checkRecord ? checkRecord.proof : null;
            
            let statusHtml = '';
            if(isChecked) {
                statusHtml = `<span style="color:#4ade80;">✅ 已完成 ${hoursAgo}小时前完成</span>`;
                if(proofUrl) {
                    statusHtml += `<img src="${proofUrl}" class="proof-img" onclick="alert('打卡证明')" style="vertical-align:middle;">`;
                }
            } else {
                let othersDone = members.filter(m => {
                    let rec = m.checkIns[todayStr];
                    return rec && rec.done === true && rec.time;
                }).map(m => ({ name: m.name, time: m.checkIns[todayStr].time }));
                let inspire = '';
                if(othersDone.length > 0) {
                    let earliest = othersDone.reduce((a,b) => (a.time < b.time ? a : b), othersDone[0]);
                    inspire = `😱 已经有队友 ${earliest.name} 在 ${earliest.time} 完成了！你还在躺？`;
                } else {
                    inspire = `🔥 还没人打卡，抢第一有奖！`;
                }
                statusHtml = `<span style="color:#facc15;">❌ 未打卡 · ${inspire}</span>`;
            }
            
            // 生成唯一ID用于文件上传
            const inputId = `fileInput_${Date.now()}_${member.name.replace(/[^a-z0-9]/gi,'')}`;
            return `
                <div class="member-row" data-name="${escapeHtml(member.name)}">
                    <div style="flex:2">
                        <strong>${escapeHtml(member.name)}</strong><br>
                        <span class="time-badge">${statusHtml}</span>
                    </div>
                    <div>
                        ${!isChecked ? `
                            <input type="file" accept="image/*" capture="environment" style="display:none;" id="${inputId}" data-name="${escapeHtml(member.name)}">
                            <button class="check-btn btn-small" data-action="check" data-inputid="${inputId}" data-name="${escapeHtml(member.name)}">📸 打卡+传图</button>
                        ` : `<button class="check-btn btn-small checked-btn" disabled>✅ 已打卡</button>`}
                    </div>
                </div>
            `;
        }).join('');
        
        // 绑定打卡事件（新版文件上传）
        document.querySelectorAll('[data-action="check"]').forEach(btn => {
            // 移除旧的listener避免重复
            btn.removeEventListener('click', window._checkHandler);
            const handler = async (e) => {
                let name = btn.getAttribute('data-name');
                let inputId = btn.getAttribute('data-inputid');
                if(name && currentRoom.members[name] && inputId) {
                    const fileInput = document.getElementById(inputId);
                    if(fileInput) {
                        fileInput.click();  // 弹出相册/相机选择
                        fileInput.onchange = (event) => {
                            const file = event.target.files[0];
                            if(file) {
                                const reader = new FileReader();
                                reader.onload = function(ev) {
                                    let imgUrl = ev.target.result;  // base64图片
                                    let today = new Date().toISOString().slice(0,10);
                                    let nowTime = getCurrentTimeStr();
                                    if(!currentRoom.members[name].checkIns[today]) currentRoom.members[name].checkIns[today] = {};
                                    currentRoom.members[name].checkIns[today].done = true;
                                    currentRoom.members[name].checkIns[today].time = nowTime;
                                    currentRoom.members[name].checkIns[today].proof = imgUrl;
                                    saveRoom();
                                    renderMain();
                                    alert(`🎉 ${name} 完成打卡！运动证明已上传，避免了社死。`);
                                };
                                reader.readAsDataURL(file);
                            } else {
                                alert("未选择图片，打卡失败");
                            }
                        };
                    } else {
                        alert("请重试");
                    }
                }
            };
            btn.addEventListener('click', handler);
            window._checkHandler = handler;
        });
    }

    // 生成嘲讽报告
    function generateRoastReport() {
        if(!currentRoom) return;
        let today = new Date().toISOString().slice(0,10);
        let members = Object.values(currentRoom.members);
        let doneList = [];
        let notDoneList = [];
        members.forEach(m => {
            let rec = m.checkIns[today];
            if(rec && rec.done === true) {
                doneList.push({ name: m.name, time: rec.time });
            } else {
                notDoneList.push(m.name);
            }
        });
        
        if(notDoneList.length === 0) {
            return "🎉 全员卷王！今天没人偷懒！继续保持！ 🎉";
        }
        
        let roasts = [
            "🤡 懒虫特工队", "🦥 树懒都比你们快", "🍗 是不是在偷吃炸鸡？", "📉 运动KPI负数", 
            "💩 打卡失败 × 核能警告", "👻 你们的腿是租来的吗？", "⚰️ 躺平区UP主", 
            "🐌 蜗牛看了都摇头", "🧻 再不动就要长蘑菇了", "🔔 羞耻铃铛叮叮叮"
        ];
        let randomRoast = roasts[Math.floor(Math.random() * roasts.length)];
        let report = `🚨 【运动刑场 每日处刑令】 🚨\n\n`;
        report += `🏅 完成打卡的勇士 (${doneList.length}人)：\n`;
        doneList.forEach(d => { report += `✅ ${d.name}  (${d.time} 完成)\n`; });
        report += `\n💩 未打卡的懒虫 (${notDoneList.length}人)：\n`;
        notDoneList.forEach(n => { report += `❌ ${n}  🙈\n`; });
        report += `\n🔨 惩罚：每人扣除 ${currentRoom.penaltyPoints} 信誉分！\n`;
        report += `🤣 ${randomRoast} 请以上懒虫自觉群里发红包/请奶茶!\n📸 还不快去运动？打卡入口在“刑场”App！`;
        return report;
    }
    
    function showReportAndCopy() {
        let report = generateRoastReport();
        let previewDiv = document.getElementById('reportPreview');
        previewDiv.style.display = 'block';
        previewDiv.innerHTML = `<strong>📋 一键复制以下内容发到微信群👇</strong><br><textarea rows="5" style="width:100%; background:#0f172a; color:white; border-radius:16px;" id="roastTextArea">${report}</textarea><br><button id="copyRoastBtn" class="btn-small">📋 复制嘲讽文案</button>`;
        document.getElementById('copyRoastBtn').addEventListener('click', () => {
            let textarea = document.getElementById('roastTextArea');
            textarea.select();
            document.execCommand('copy');
            alert("✅ 嘲讽报告已复制！快去群里处刑懒虫吧 🤡");
        });
    }

    function resetSeason() {
        if(!currentRoom) return;
        if(confirm("⚡ 开始新的一轮？当日所有未打卡玩家将立刻扣除惩罚分，并重置打卡状态。")) {
            let today = new Date().toISOString().slice(0,10);
            let members = Object.values(currentRoom.members);
            members.forEach(m => {
                let rec = m.checkIns[today];
                let isDone = rec && rec.done === true;
                if(!isDone) {
                    m.creditScore = (m.creditScore || 100) - currentRoom.penaltyPoints;
                    if(m.creditScore < 0) m.creditScore = 0;
                }
                m.checkIns = {};
            });
            saveRoom();
            renderMain();
            alert("✅ 新赛季开始！未打卡的已经扣过分了，重新做人吧。");
        }
    }

    function createRoom() {
        let name = document.getElementById('roomName').value.trim() || "运动刑场";
        let penalty = parseInt(document.getElementById('penaltyPoints').value);
        if(isNaN(penalty)) penalty = 20;
        if(pendingMembers.length < 2) { alert("至少2人才能开刑"); return; }
        let membersObj = {};
        pendingMembers.forEach(m => {
            membersObj[m.name] = {
                name: m.name,
                creditScore: 100,
                checkIns: {}
            };
        });
        let today = new Date().toISOString().slice(0,10);
        for(let n in membersObj) { 
            membersObj[n].checkIns[today] = { done: false, time: null, proof: null }; 
        }
        currentRoom = {
            id: generateId(),
            name: name,
            penaltyPoints: penalty,
            members: membersObj,
            createdAt: Date.now()
        };
        saveRoom();
        document.getElementById('setupPanel').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
        renderMain();
    }

    function renderTempMembers() {
        let container = document.getElementById('tempMemberList');
        if(pendingMembers.length === 0) { container.innerHTML = "<div>➕ 添加2人以上</div>"; return; }
        container.innerHTML = pendingMembers.map((m,idx) => `<div class="flex" style="justify-content:space-between;"><span>🧑‍🤝‍🧑 ${escapeHtml(m.name)}</span><button class="btn-small" data-delidx="${idx}">移除</button></div>`).join('');
        document.querySelectorAll('[data-delidx]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let idx = parseInt(btn.getAttribute('data-delidx'));
                pendingMembers.splice(idx,1);
                renderTempMembers();
            });
        });
    }
    
    function escapeHtml(str) { 
        if(!str) return ''; 
        return str.replace(/[&<>]/g, function(m){ 
            if(m==='&') return '&amp;'; 
            if(m==='<') return '&lt;'; 
            if(m==='>') return '&gt;'; 
            return m;
        }); 
    }

    // 初始化事件
    document.getElementById('addMemberBtn').addEventListener('click', () => {
        let name = document.getElementById('memberNameInput').value.trim();
        if(!name) return alert("填个名字");
        if(pendingMembers.some(m=>m.name===name)) return alert("重复");
        pendingMembers.push({name: name});
        renderTempMembers();
        document.getElementById('memberNameInput').value = '';
    });
    document.getElementById('createRoomBtn').addEventListener('click', createRoom);
    document.getElementById('resetBtn').addEventListener('click', resetSeason);
    document.getElementById('genReportBtn').addEventListener('click', showReportAndCopy);
    
    // 检查URL参数加载房间
    let urlRoom = new URLSearchParams(location.search).get('room');
    if(urlRoom && loadRoom(urlRoom)) {
        currentRoom = loadRoom(urlRoom);
        document.getElementById('setupPanel').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
        renderMain();
    } else {
        renderTempMembers();
    }
</script>
</body>
</html>
